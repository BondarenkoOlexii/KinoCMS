{% extends 'custom_admin/theme.html' %}
{% load static %}

{% block content1 %}

    <link rel="stylesheet" href="{% static 'dist/css/news.css' %}"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=cancel" />
    <div class="app-content-header">
        <div class="container-fluid">
            <div class="row">
                <div class="col-sm-6">
                    <h3 class="mb-0">Створення</h3>
                </div>
            </div>
        </div>
    </div>
    <div class="app-content">
        <div class="container-fluid">
            <div class="row g-4 justify-content-center"> <div class="col-md-8 col-lg-7">
                    <div class="card card-primary card-outline mb-4">
                        <div class="card-body">
                            <form class="needs-validation django-upload-form" novalidate method="post" enctype="multipart/form-data">
                                {% csrf_token %}


                                <div class="card-header text-center">
                                    <div class="py-3">
                                        <h2 class="card-title w-100" >Форма для створення</h2>
                                    </div>
                                </div>

                                <div class="row g-3">
                                    <div class="col-sm-6">
                                        <label class="form-label">Кинотеатр</label>

                                        <select style="margin-bottom: 30px" name="cinema_id" class="custom-select form-control-border border-width-2">
                                            <option value="">Оберіть Кінотеатр</option>
                                            {% for cinema in all_cinemas %}
                                                <option value="{{cinema.id}}">{{ cinema.name }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>


                                <div class="row g-3">
                                    <div class="col-sm-6">
                                        <label class="form-label" style="width: 50%">Початкова дата</label>
                                        <input type="date" name="start_date" class="form-control">
                                    </div>

                                    <div class="col-sm-6">
                                        <label class="form-label">Кількість днів</label>
                                        <input type="number" name="count_date" class="form-control">
                                    </div>

                                </div>


                                <hr class="my-4" />

                                <table class="table table-hover table-striped mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Время</th>
                                            <th>Фильм</th>
                                            <th>Зал</th>
                                            <th>Цена</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        {% for item in items %}
                                        <tr>
                                            <td>{{item.start_time }}</td>
                                            <td>{{item.film_id.name}}</td>
                                            <td>{{item.hall_id.name}}</td>
                                            <td>{{item.price}}</td>
                                        </tr>
                                        {% endfor %}
                                        </tbody>
                                </table>


                                <hr class="my-4" />

                                <button class="w-100 btn btn-primary btn-lg" type="submit">Зберегти</button>
                            </form>
                            </div>
                    </div>
                </div>
            </div>
            </div>
    </div>
    <script src="{% static 'dist/js/image_formset.js' %}"></script>
{% endblock %}
