{% extends 'base.html' %}
{% load static %}
{% load i18n %}

{% block content %}
<div class="p-4 p-md-5 mb-4 rounded text-body-emphasis bg-body-secondary" style="margin-bottom: 40px">
    <div class="col-lg-6 px-0">
    </div>
</div>



<div class="cinema-card p-4 mb-4 shadow-sm border-0 text-white" style="background-color: #212529; border-radius: 12px;">
    <div>
        <h3>{{ item.name }}</h3>
        <div style="margin-bottom: 20px">
            <span class="badge-tag tag-3d">3D</span>
            <span class="badge-tag tag-2d">2D</span>
            <span class="badge-tag tag-imax">IMAX</span>
        </div>
    </div>
    <div class="d-flex align-items-start">
        <div class="logo-placeholder d-flex align-items-center justify-content-center" style="width: 350px; height: 300px; background-color: #343a40; border-radius: 8px;">
            {% for form in image_item %}
                {% if form.image_type == 'logo' %}
                    <img src="{{ form.image.photo.url }}" alt="Logo" class="img-fluid rounded" style="max-height: 100%; width: 350px">
                {% endif %}
            {% endfor %}
        </div>

        <div class="flex-grow-1">
            <p class="btn-schedule px-4 py-2 fw-semibold text-nowrap" style="color: #ffffff">{{ item.description }}</p>
        </div>
    </div>
</div>


{% endblock %}
