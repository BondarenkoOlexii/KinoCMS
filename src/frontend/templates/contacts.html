{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="p-4 p-md-5 mb-4 rounded text-body-emphasis bg-body-secondary" style="margin-bottom: 40px">
    <div class="col-lg-6 px-0">
    </div>
</div>

{% for form in items %}
    <div class="cinema-card d-flex align-items-center p-4 mb-4 shadow-sm border-0 text-white" style="background-color: #212529; border-radius: 12px;">
        <div class="d-flex w-100">
            <div class="logo-placeholder d-flex align-items-center justify-content-center" style="width: 350px; height: 300px; background-color: #343a40; border-radius: 8px;">
                <img src="{{ form.image.photo.url }}" alt="Logo" class="img-fluid rounded" style="max-height: 100%;">
            </div>

            <div class="ms-auto d-flex flex-column align-items-end">
                <p class="btn-schedule px-4 py-2 fw-semibold text-nowrap" style="color: #ffffff">{{ form.name }}</p>
                <p class="btn-schedule px-4 py-2 fw-semibold text-nowrap" style="color: #ffffff">{{ form.adress }}</p>
            </div>
        </div>
    </div>
{% endfor %}

{% endblock %}
