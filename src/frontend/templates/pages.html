{% extends 'base.html' %}
{% load static %}
{% load i18n %}

{% block content %}
<div class="p-4 p-md-5 mb-4 rounded text-body-emphasis bg-body-secondary" style="margin-bottom: 40px">
    <div class="col-lg-6 px-0">
    </div>
</div>


<div class="p-5 mb-4 border bg-white shadow-sm d-flex flex-column" style="border-radius: 8px;">
    <h3 class="fw-bold text-dark mb-3 mx-auto">{{item.name}}</h3>

    <div class="mx-auto" style="width: 50px; height: 3px; background-color: #333; margin-bottom: 20px;"></div>

    <div class="text-dark" style="font-size: 16px; line-height: 1.6; text-align: justify;">
        {{ item.description }}
    </div>
</div>


<div id="cinemaGallery" class="carousel slide shadow-sm border bg-white p-4 mb-4" data-bs-ride="carousel" style="border-radius: 8px;">
    <h3 class="fw-bold text-dark mb-4 text-center">Галерея</h3>

    <div class="carousel-inner">
        {% for form in image_item %}
            {% if form.image_type == 'gallery' %}
                <div class="carousel-item {% if not gallery_started %}active{% endif %}">
                    <div class="gallery-slide-container" style="height: 400px;">
                        <img src="{{ form.image.photo.url }}" class="d-block w-100 h-100 rounded" style="object-fit: contain; background: #f8f9fa;" alt="Gallery Image">
                    </div>
                </div>
            {% endif %}
        {% endfor %}
    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#cinemaGallery" data-bs-slide="prev">
        <span class="carousel-control-prev-icon bg-dark rounded-circle" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#cinemaGallery" data-bs-slide="next">
        <span class="carousel-control-next-icon bg-dark rounded-circle" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>
</div>

{% endblock %}
