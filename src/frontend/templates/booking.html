{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="cinema-card d-flex align-items-center p-4 mb-4 shadow-sm border-0 text-white" style="background-color: #212529; border-radius: 12px;">
    <div class="logo-placeholder d-flex align-items-center justify-content-center" style="width: 250px; height: 200px; background-color: #343a40; border-radius: 8px; overflow: hidden;">
        <img src="{{ image_item.image.photo.url }}" alt="Logo" class="img-fluid" style="height: 100%; width: 100%; object-fit: cover;">
    </div>
    <div class="d-flex flex-column gap-2" style="margin-left: 20px">
        <h4 class="fw-bold mb-1">{{ film_item.name }}</h4>
        <div class="d-flex gap-2">
            <span class="badge bg-primary">{{ item.day }}</span>
            <span class="badge bg-info text-dark">{{ item.start_time }}</span>
        </div>
    </div>
</div>

<div class="mt-4 p-4 bg-white rounded shadow-sm">
    <h5 class="card-title mb-0 py-3 text-center text-uppercase fw-bold border-bottom">Попередній перегляд залу</h5>

    <div class="d-flex justify-content-center my-5">
        <div id="hall-grid" class="hall-grid" data-json-url="{{ item.hall_id.json_file.url }}" data-session-id="{{ item.id }}" data-booked='{{ booked_ids|safe }}'>
            </div>
    </div>

    <div class="d-flex justify-content-center align-items-center flex-wrap gap-4 py-3 border-top bg-light rounded-bottom">
        <div class="d-flex align-items-center">
            <span class="seat available me-2"></span> <small>Вільно</small>
        </div>
        <div class="d-flex align-items-center">
            <span class="seat selected me-2"></span> <small>Ваш вибір</small>
        </div>
        <div class="d-flex align-items-center">
            <span class="seat occupied me-2"></span> <small>Зайнято</small>
        </div>
    </div>
    <form method="post" id="booking-form">
        {% csrf_token %}
        <div class="row-3">
            <button class="btn btn-warning w-50 col-3" type="submit" id="reserve-btn">Забронювати</button>
            <button class="btn btn-warning w-50" type="submit" id="buy-btn">Купити</button>
        </div>
    </form>
</div>
{% endblock %}




{% block js %}
    {{ block.super }}

{% endblock %}
