{% extends 'base.html' %}
{% load static %}

{% block content %}


<div class="col-lg-3 col-md-6 mb-4">
    <div class="card h-100 shadow-sm border-0 cinema-hover-card" style="border-radius: 15px; overflow: hidden;">
        <div class="card-body d-flex flex-column align-items-center text-center p-4">
            {% for form in image_items %}
                {% if form.image_type == "logo" %}
                    <div class="logo-container mb-3 d-flex align-items-center justify-content-center" style="height: 120px; width: 100%;">
                        <a href="{% url 'cinema_pages' form.images_info.id %}">
                            <img src="{{ form.image.photo.url }}"
                                 class="img-fluid rounded"
                                 style="max-height: 100px; object-fit: contain;"
                                 alt="{{ form.images_info.name }}">
                        </a>
                    </div>

                    <h5 class="fw-bold mt-auto">
                        <a href="{% url 'cinema_pages' form.images_info.id %}" class="text-dark text-decoration-none stretched-link">
                            {{ form.images_info.name }}
                        </a>
                    </h5>
                {% endif %}
            {% endfor %}
        </div>
    </div>
</div>

{% endblock %}
