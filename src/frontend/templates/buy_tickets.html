{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="cinema-card d-flex align-items-center p-4 mb-4 shadow-sm border-0 text-white" style="background-color: #212529; border-radius: 12px;">
    <div class="logo-placeholder d-flex align-items-center justify-content-center" style="width: 250px; height: 200px; background-color: #343a40; border-radius: 8px; overflow: hidden;">
        <img src="{{ film_logo_item.image.photo.url }}" alt="Logo" class="img-fluid" style="height: 100%; width: 100%; object-fit: cover;">
    </div>
    <div class="d-flex flex-column gap-2" style="margin-left: 20px">
        <h4 class="fw-bold mb-1">{{ film_item.name }}</h4>
        <div class="d-flex gap-2">
            <span class="badge bg-primary">{{ film_item.day }}</span>
            <span class="badge bg-info text-dark">{{ film_item.start_time }}</span>
        </div>
    </div>
</div>

{% endblock %}
